[project]
name = "ouroboros"
version = "0.1.0"
description = "Ouroboros nonlinear oscillator model for birdsong/vocalization analysis"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "librosa>=0.10.0",
    "mambapy>=1.2.0",
    "matplotlib>=3.7.0",
    "numpy>=1.24.0",
    "pandas>=2.0.0",
    "Pillow>=9.0.0",
    "scikit-learn>=1.2.0",
    "scipy>=1.10.0",
    "seaborn>=0.13.0",
    "soundfile>=0.12.0",
    "ssqueezepy>=0.6.0",
    "tensorboard>=2.12.0",
    "torch==2.8.0+cu126; sys_platform == 'win32'",
    "torch==2.5.1+cu121; sys_platform == 'linux'",
    "torchdiffeq>=0.2.5",
    "tqdm>=4.65.0",
]

[project.optional-dependencies]
umap = [
    "umap-learn>=0.5.0",
]
denoise = [
    "noisereduce>=2.0.0",
]
# Only needed for data/generate_data_gabo.py (synthetic pulse-sequence
# data generation). Requires a C++17-capable compiler (GCC>=5) to build
# jax's ml-dtypes from source; not available on some older HPC nodes.
synth = [
    "diffrax>=0.7.0",
]
all = [
    "umap-learn>=0.5.0",
    "noisereduce>=2.0.0",
    "diffrax>=0.7.0",
]

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu121"
url = "https://download.pytorch.org/whl/cu121"
explicit = true

[tool.uv.sources]
torch = [
    { index = "pytorch-cu126", marker = "sys_platform == 'win32'" },
    { index = "pytorch-cu121", marker = "sys_platform == 'linux'" },
]
